  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiteLife — Life Tips Anytime</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />

  <!-- Font Awesome (for search/mic icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- html2canvas for “Download as Image” -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('serviceWorker.js')
          .then(() => console.log('✅ SW registered'))
          .catch(err => console.log('SW failed', err));
      });
    }
  </script>
</head>
<body>
  <!-- Motivational Banner -->
  <div id="motivationBanner" class="banner" data-category="mindset,nutrition,fitness,default">
    <p id="motivationText">Loading motivation...</p>
  </div>

  <header>
    <!-- Theme Toggle (header) -->
    <div class="header-actions">
      <button id="themeToggle" class="btn small">🌗Color Scheme</button>
    </div>

    <h1>LiteLife</h1>

    <!-- Search bar (with embedded icons, your preferred markup) -->
   <div class="container search-wrap">
  <div class="row height d-flex justify-content-center align-items-center">
    <div class="col-md-12">
      <div class="form">
        <i class="fa fa-search"></i>
        <input  type="text" id="searchInput" 
          class="form-control form-input" placeholder="Search tips..." />
        <button id="micBtn" class="left-pan" title="Voice Search">
          <i class="fa fa-microphone"></i>
        </button>
      </div>
    </div>
  </div>
</div>

    <!-- Premium notice -->
    <div id="premiumNotice" class="premium-banner" style="display:none;">
      🔒 This feature is part of <span>LiteLife Premium</span>. Coming soon!
    </div>

    <!-- Category Buttons -->
    <div id="categoryButtons" class="chipbar">
      <button data-category="All" class="chip active">All</button>
      <button data-category="First Aid" class="chip">First Aid</button>
      <button data-category="Pregnancy" class="chip">Pregnancy</button>
      <button data-category="Nutrition" class="chip">Nutrition</button>
      <button data-category="Mental Health" class="chip">Mental Health</button>
    </div>

    <!-- Links -->
    <nav class="quick-links">
      <a href="favorites.html">❤ Favorites</a>
      <a href="help.html">💡 Ask a Question</a>
      <a href="suggest.html">➕ Suggest a Tip</a>
      <a href="trending.html">🔥 Trending</a>
    </nav>
  </header>

  <!-- Count -->
  <h2 id="tipCount" class="tip-count">Showing 0 health tips</h2>

  <main id="tipContainer" class="grid">
    <!-- Cards injected by app.js -->
  </main>

  <!-- Edit Tip Modal -->
  <div id="editModal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h2>Edit Tip</h2>
      <input type="text" id="editTitle" placeholder="Tip Title" />
      <textarea id="editContent" placeholder="Tip Content" rows="4"></textarea>
      <select id="editCategory">
        <option value="First Aid">First Aid</option>
        <option value="Pregnancy">Pregnancy</option>
        <option value="Nutrition">Nutrition</option>
        <option value="Mental Health">Mental Health</option>
      </select>
      <div class="modal-actions">
        <button id="saveEditBtn" class="btn success">Save Changes</button>
        <button onclick="closeEdit()" class="btn danger">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Daily Tip Popup -->
  <div id="dailyTipPopup" class="tip-popup" style="display:none;">
    <h3>💡 Daily Health Tip</h3>
    <p id="dailyTipText"></p>
    <button onclick="closeDailyTip()" class="btn info">Got it!</button>
  </div>

  <!-- Daily Challenge Toast -->
  <div id="challengeToast" class="toast" aria-live="polite"></div>

  <!-- Floating Action Button -->
  <div class="fab-container" id="fab">
    <div class="fab-options" id="fabOptions">
      <button class="fab-option" data-action="toggle-theme" title="Toggle Theme">🌓</button>
      <button class="fab-option" data-action="open-goals" title="Health Goals">🎯</button>
      <button class="fab-option" data-action="daily-challenge" title="Daily Challenge">⚡</button>
      <button class="fab-option" data-action="goto-favorites" title="Favorites">❤</button>
      <button class="fab-option" data-action="goto-suggest" title="Suggest a Tip">➕</button>
      <button class="fab-option" data-action="goto-help" title="Help">❓</button>
      <button class="fab-option" data-action="goto-trending" title="Trending">🔥</button>
    </div>
    <button class="fab-button" id="fabBtn" aria-label="Open actions">+</button>
  </div>

  <!-- Goals Modal -->
  <div id="goalsModal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h2>🎯 Your Health Goals</h2>
      <form id="goalsForm" class="goals-form">
        <input type="text" id="goalTitle" placeholder="e.g., Walk 5,000 steps" />
        <input type="number" id="goalTarget" placeholder="Target (e.g., 7 days)" />
        <button type="submit" class="btn success">Add Goal</button>
      </form>
      <ul id="goalsList" class="goals-list"></ul>
      <div class="modal-actions">
        <button id="closeGoals" class="btn">Close</button>
      </div>
    </div>
  </div>

  <script src="themeManager.js"></script>
  <script src="premiumManager.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
