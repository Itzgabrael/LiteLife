<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suggest a Tip — LiteLife</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>📝 Suggest a Health Tip</h1>
    <a href="index.html">⬅ Back to Home</a>
  </header>

  <main style="padding: 16px;">
    <form id="tipForm">
      <input type="text" id="tipTitle" placeholder="Tip Title" required /><br/><br/>
      <textarea id="tipContent" placeholder="Your health advice..." rows="4" required></textarea><br/><br/>
      <select id="tipCategory" required>
        <option value="" disabled selected>Select Category</option>
        <option value="First Aid">First Aid</option>
        <option value="Pregnancy">Pregnancy</option>
        <option value="Nutrition">Nutrition</option>
        <option value="Mental Health">Mental Health</option>
      </select><br/><br/>
      <button type="submit" class="btn success">Submit Tip</button>
    </form>
    <p id="msg" style="margin-top:15px;"></p>
  </main>

  <script>
    const form = document.getElementById("tipForm");
    const msg  = document.getElementById("msg");

    form.addEventListener("submit", function(e){
      e.preventDefault();
      const title = document.getElementById("tipTitle").value.trim();
      const content = document.getElementById("tipContent").value.trim();
      const category = document.getElementById("tipCategory").value;
      if(!title || !content || !category) return;

      const newTip = { id: Date.now(), title, content, category };

      let userTips = JSON.parse(localStorage.getItem("userTips")) || [];
      userTips.push(newTip);
      localStorage.setItem("userTips", JSON.stringify(userTips));

      msg.textContent = "✅ Your tip has been saved successfully!";
      form.reset();
    });
  </script>
  <script src="themeManager.js"></script>
</body>
</html>
