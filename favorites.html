<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiteLife - My Saved Tips</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Category button styles */
        .category-item {
            padding: 10px 18px;
            border-radius: 8px;
            background: #f4f4f4;
            color: #333;
            border: 1px solid #ccc;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s, color 0.2s;
        }
        .category-item.selected {
            background: #2ecc71;
            color: white;
        }
        .save-status {
            margin-top: 12px;
            color: green;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>📌 My Saved Tips</h1>
        <a href="index.html">⬅ Back to Home</a>
    </header>

    <main id="savedTipsContainer"></main>

    <hr style="margin: 40px 0;" />
    <h3>🧠 Choose Your Favorite Health Categories</h3>
    <div class="category-list" id="categoryList" style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px;"></div>
    
    <button id="saveBtn" style="margin-top: 20px; padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 8px; font-size: 16px;">
        💾 Save My Interests
    </button>
    <p id="saveStatus" class="save-status">✅ Favorites saved!</p>

    <script src="data.js"></script>
    <script>
        // --- Render Saved Tips ---
        const savedTipsContainer = document.getElementById("savedTipsContainer");
        const savedIds = JSON.parse(localStorage.getItem("savedTips")) || [];
        const savedTips = healthTips.filter(tip => savedIds.includes(tip.id));

        if (savedTips.length === 0) {
            savedTipsContainer.innerHTML = "<p style='text-align:center;'>No saved tips yet.</p>";
        } else {
            savedTips.forEach(tip => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `<h2>${tip.title}</h2><p>${tip.content}</p>`;
                savedTipsContainer.appendChild(card);
            });
        }

        // --- Category Selection ---
        const categories = [
            "First Aid", "Nutrition", "Mental Health", "Pregnancy", "Wellness", "Exercise",
            "Hygiene", "Stress", "Sleep", "Women's Health", "Men's Health", "Disease Prevention"
        ];

        const categoryList = document.getElementById("categoryList");
        const savedFavorites = JSON.parse(localStorage.getItem("favoriteCategories")) || [];

        categories.forEach(cat => {
            const div = document.createElement("div");
            div.className = "category-item";
            div.textContent = cat;
            if (savedFavorites.includes(cat)) {
                div.classList.add("selected");
            }
            div.addEventListener("click", () => {
                div.classList.toggle("selected");
            });
            categoryList.appendChild(div);
        });

        // --- Save Button ---
        document.getElementById("saveBtn").addEventListener("click", () => {
            const selected = Array.from(document.querySelectorAll(".category-item.selected"))
                                  .map(el => el.textContent);
            localStorage.setItem("favoriteCategories", JSON.stringify(selected));
            const status = document.getElementById("saveStatus");
            status.style.display = "block";
            setTimeout(() => status.style.display = "none", 1500);
        });
    </script>
    <script src="themeManager.js"></script>
</body>
</html>
