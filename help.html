<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LiteLife — Help</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <h1>💡 Ask a Question</h1>
    <a href="index.html">⬅ Back to Home</a>
  </header>

  <main style="padding: 16px;">
    <p>Have a question about health tips? Ask below:</p>
    <textarea id="helpQuestion" rows="5" placeholder="Type your question..." style="width:100%;"></textarea>
    <div style="margin-top: 10px;">
      <button id="sendQuestion" class="btn info">Send</button>
    </div>
    <p id="helpStatus" style="margin-top:10px;"></p>
  </main>

  <script>
    document.getElementById("sendQuestion").addEventListener("click", () => {
      const q = document.getElementById("helpQuestion").value.trim();
      if(!q) return;
      localStorage.setItem("lastHelpQuestion", q);
      document.getElementById("helpStatus").textContent = "✅ Your question has been saved. We'll improve this later!";
      document.getElementById("helpQuestion").value = "";
    });
  </script>
  <script src="themeManager.js"></script>
</body>
</html>
